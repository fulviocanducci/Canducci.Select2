name: Tests

on:
  push:
    branches:
      - master
      - "tests/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore Canducci.Select2.slnx

      - name: Build
        run: dotnet build Canducci.Select2.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Canducci.Select2.Tests/Canducci.Select2.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=select2-tests.trx"

      - name: Pack NuGet package
        run: dotnet pack Canducci.Select2/Canducci.Select2.csproj --configuration Release --no-build --output ./artifacts

      - name: Verify package contents
        run: |
          package=$(find ./artifacts -name "*.nupkg" -print -quit)
          test -n "$package"
          unzip -l "$package"
          unzip -l "$package" | grep -q "README.md"
          unzip -l "$package" | grep -q "images/icon.png"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: canducci-select2-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: select2-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
